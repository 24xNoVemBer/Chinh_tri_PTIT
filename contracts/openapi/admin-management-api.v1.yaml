openapi: 3.1.0
info:
  title: PTIT Chính Trị Admin and Class Management API
  version: 1.0.0
  description: Scoped administration, multi-lecturer classes, practice banks, class Q&A and analytics.
servers:
  - url: https://api.example.ptit.edu.vn
security:
  - sessionCookie: []
paths:
  /api/admin/users:
    get:
      operationId: listManagedUsers
      responses: { '200': { description: Paginated users } }
  /api/admin/users/{userId}/role:
    patch:
      operationId: updateManagedUserRole
      responses:
        '200': { description: Role updated and stale sessions revoked }
        '409': { description: Last administrator cannot be demoted }
  /api/admin/users/{userId}:
    patch:
      operationId: updateManagedUser
      responses:
        '200': { description: Role or status updated and stale sessions revoked }
        '409': { description: Last active administrator cannot be disabled }
  /api/admin/subjects:
    get:
      operationId: listManagedSubjects
      responses: { '200': { description: Subjects } }
    post:
      operationId: createManagedSubject
      responses: { '201': { description: Subject created } }
  /api/admin/subjects/{subjectId}:
    patch:
      operationId: updateManagedSubject
      responses: { '200': { description: Subject updated } }
    delete:
      operationId: archiveManagedSubject
      responses: { '200': { description: Subject archived } }
  /api/admin/subjects/{subjectId}/chapters:
    get:
      operationId: listManagedChapters
      responses: { '200': { description: Subject curriculum } }
    post:
      operationId: createManagedChapter
      responses: { '201': { description: Chapter created } }
  /api/admin/chapters/{chapterId}/lessons:
    get:
      operationId: listManagedLessons
      responses: { '200': { description: Chapter lessons } }
    post:
      operationId: createManagedLesson
      responses: { '201': { description: Lesson created } }
  /api/admin/chapters/{chapterId}:
    patch:
      operationId: updateManagedChapter
      responses: { '200': { description: Chapter updated } }
    delete:
      operationId: deleteManagedChapter
      responses:
        '200': { description: Empty chapter deleted }
        '409': { description: Chapter still contains lessons }
  /api/admin/lessons/{lessonId}:
    patch:
      operationId: updateManagedLesson
      responses: { '200': { description: Lesson updated } }
    delete:
      operationId: deleteManagedLesson
      responses:
        '200': { description: Unused lesson deleted }
        '409': { description: Lesson is in use }
  /api/admin/subjects/{subjectId}/materials:
    get:
      operationId: listManagedMaterials
      responses: { '200': { description: Subject materials } }
    post:
      operationId: createManagedMaterial
      responses: { '201': { description: Material created } }
  /api/admin/materials/{materialId}:
    patch:
      operationId: updateManagedMaterial
      responses: { '200': { description: Material updated } }
    delete:
      operationId: deleteManagedMaterial
      responses:
        '200': { description: Unused material deleted }
        '409': { description: Material is in use }
  /api/admin/materials/{materialId}/versions:
    post:
      operationId: createManagedMaterialVersion
      responses: { '201': { description: Material version created } }
  /api/admin/terms:
    get:
      operationId: listAcademicTerms
      responses: { '200': { description: Academic terms } }
    post:
      operationId: createAcademicTerm
      responses: { '201': { description: Academic term created } }
  /api/admin/terms/{termId}:
    patch:
      operationId: updateAcademicTerm
      responses: { '200': { description: Academic term updated } }
  /api/admin/classes:
    get:
      operationId: listManagedClasses
      responses: { '200': { description: Credit classes } }
    post:
      operationId: createManagedClass
      responses: { '201': { description: Credit class created } }
  /api/admin/classes/{classId}:
    patch:
      operationId: updateManagedClass
      responses: { '200': { description: Credit class updated } }
    delete:
      operationId: archiveManagedClass
      responses: { '200': { description: Credit class archived } }
  /api/admin/classes/{classId}/lecturers:
    get:
      operationId: listClassLecturers
      responses: { '200': { description: Active and historical lecturer assignments } }
    post:
      operationId: assignClassLecturer
      responses: { '201': { description: Lecturer assigned } }
  /api/admin/classes/{classId}/lecturers/{lecturerId}:
    patch:
      operationId: updateClassLecturerAssignment
      responses: { '200': { description: Assignment updated } }
    delete:
      operationId: endClassLecturerAssignment
      responses: { '200': { description: Assignment ended and claims released } }
  /api/admin/practice-questions:
    get:
      operationId: listSharedPracticeQuestions
      responses: { '200': { description: Shared subject question bank } }
    post:
      operationId: createSharedPracticeQuestion
      responses: { '201': { description: Shared question created } }
  /api/admin/practice-questions/{questionId}:
    patch:
      operationId: updateSharedPracticeQuestion
      responses: { '200': { description: Shared question updated } }
    delete:
      operationId: archiveSharedPracticeQuestion
      responses: { '200': { description: Shared question archived } }
  /api/admin/questions/unrouted:
    get:
      operationId: listUnroutedQuestions
      responses: { '200': { description: Questions requiring administrative routing } }
  /api/admin/questions/unrouted/{questionId}/route:
    post:
      operationId: routeUnroutedQuestion
      responses:
        '200': { description: Question routed to a matching credit class }
        '409': { description: Student is not enrolled in the selected class }
  /api/admin/questions/routed:
    get:
      operationId: listRoutedQuestions
      description: Lists unanswered queued or claimed questions, optionally filtered by class.
      responses: { '200': { description: Questions available for administrative reassignment } }
  /api/admin/questions/{questionId}/reassign:
    post:
      operationId: reassignRoutedQuestion
      description: Assigns an unanswered routed question to an active lecturer of the same class.
      responses:
        '200': { description: Question reassigned }
        '409':
          { description: Question is not routed, already answered, or lecturer is not assigned }
  /api/admin/audit-logs:
    get:
      operationId: listAdministrativeAuditLogs
      responses: { '200': { description: Audit log } }
  /api/lecturer/classes/{classId}/practice-questions:
    get:
      operationId: listClassPracticeQuestions
      description: Returns published subject-shared questions and lecturer-owned questions assigned to this class. Shared questions are read-only.
      responses: { '200': { description: Questions available to one assigned credit class } }
  /api/lecturer/classes/{classId}/question-queue:
    get:
      operationId: listClassQuestionQueue
      description: Returns the shared queue, claim ownership and 24-hour SLA state for an assigned lecturer.
      responses:
        '200': { description: Shared class Q&A queue }
        '403': { description: Lecturer is not actively assigned to the class }
  /api/lecturer/classes/{classId}/question-queue/{questionId}/claim:
    post:
      operationId: claimClassQuestion
      responses:
        '200': { description: Question claimed atomically }
        '409': { description: Question already claimed }
  /api/lecturer/classes/{classId}/question-queue/{questionId}/release:
    post:
      operationId: releaseClassQuestion
      responses:
        '200': { description: Question returned to the queue }
        '409': { description: Question is not currently claimed by this lecturer }
  /api/lecturer/classes/{classId}/analytics:
    get:
      operationId: getClassLearningAnalytics
      responses: { '200': { description: Class-scoped learning and Q&A metrics } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ptit_session
